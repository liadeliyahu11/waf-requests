[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waf_requests"
version = "0.1.0"
description = "Educational drop-in requests shim demonstrating how managed WAFs miss exploits (AWS WAF, Cloudflare, Akamai)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3"]
lab = ["flask>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
